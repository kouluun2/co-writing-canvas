name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: co-writing-canvas/package-lock.json

      - name: Install dependencies
        working-directory: .
        run: npm ci

      - name: Build Next.js app
        working-directory: .
        run: npm run build
